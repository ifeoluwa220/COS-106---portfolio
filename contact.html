  <main>
    <h1>Contact Me</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      Have a question or want to collaborate on a Cybersecurity or Web project? Send me a message below!
    </p>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Ajibade Ifeoluwa">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" value="a.ifeoluwa8693@miva.edu.ng" placeholder="a.ifeoluwa8693@miva.edu.ng">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Digits Only)</label>
          <input type="text" id="phone" value="08101727986" placeholder="08101727986">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Send Message</button>
      </form>

      <p id="feedbackMsg" class="feedback-msg"></p>
    </div>
  </main>
